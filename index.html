<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173404">
<title>Torneo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Torneo">
<style>
:root{
  --verde:#173404; --verde2:#27500A; --verde3:#3B6D11; --verdeclaro:#EAF3DE; --lima:#97C459; --lima2:#C0DD97;
  --fondo:#F4F3EE; --blanco:#fff; --texto:#2C2C2A; --gris:#5F5E5A; --gris2:#888780; --linea:#E3E1DA; --borde:#D3D1C7;
  --ambar:#FAEEDA; --ambar2:#633806; --rojo:#A32D2D; --rojoclaro:#FCEBEB; --azul:#185FA5; --azulclaro:#E6F1FB;
}
*{box-sizing:border-box}
html,body{margin:0;background:#E9E8E2;color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--fondo);display:flex;flex-direction:column;position:relative}
header{background:var(--verde);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}
header .t{display:flex;align-items:center;gap:10px}
header h1{font-size:18px;font-weight:600;margin:0;line-height:1.2}
header .s{font-size:13px;color:var(--lima2);margin-top:2px}
.demo{background:var(--ambar);color:var(--ambar2);font-size:12px;text-align:center;padding:4px 10px}
main{flex:1;padding:12px 12px 90px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid var(--borde);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--gris2);padding:4px 6px;cursor:pointer;min-width:60px}
nav button.on{color:var(--verde3);font-weight:600}
nav svg{width:22px;height:22px}
.card{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:12px;margin-bottom:10px}
.k{font-size:12px;color:var(--gris);margin-bottom:6px}
h2{font-size:16px;margin:4px 2px 10px;font-weight:600}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--linea)}
.row:last-child{border-bottom:0}
.eq{display:flex;align-items:center;gap:6px;min-width:0}
.eq span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq.r{justify-content:flex-end;text-align:right}
.esc{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.sc{font-weight:700;background:var(--verdeclaro);color:var(--verde2);border-radius:8px;padding:3px 10px;min-width:56px;text-align:center;font-size:15px}
.sc.pend{background:#F1EFE8;color:var(--gris);font-weight:500;font-size:13px}
.tag{font-size:10px;font-weight:700;border-radius:5px;padding:1px 5px;margin-left:4px}
.tag.wo{background:var(--rojoclaro);color:var(--rojo)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.bt{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;font-size:13px}
.bt svg{width:24px;height:24px;color:var(--verde3);display:block;margin:0 auto 4px}
.big{font-size:22px}
.selfecha{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.selfecha button{background:#fff;border:1px solid var(--borde);border-radius:10px;width:40px;height:36px;cursor:pointer;font-size:18px}
.selfecha b{font-size:16px}
.selfecha small{display:block;text-align:center;color:var(--gris);font-size:12px;font-weight:400}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{font-size:11px;color:var(--gris);font-weight:500;text-align:center;padding:4px 2px;border-bottom:1px solid var(--borde)}
.tb td{text-align:center;padding:7px 2px;border-bottom:1px solid var(--linea)}
.tb td.n{text-align:left}
.tb td.p{font-weight:700}
.tb tr.cut td{border-bottom:2px dashed var(--lima)}
.tb tr.cut2 td{border-bottom:2px dashed #EF9F27}
.ley{font-size:12px;color:var(--gris);display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.ley i{display:inline-block;width:18px;border-top:2px dashed var(--lima);vertical-align:middle;margin-right:4px}
.ley i.o{border-color:#EF9F27}
.llave{display:flex;flex-direction:column;gap:6px}
.cr{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:8px 10px;font-size:13px}
.cr .l{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.cr .l.g{font-weight:700;color:var(--verde2)}
.cr .l.x{color:var(--gris2)}
.cr .pen{font-size:11px;color:var(--gris)}
.seg{display:flex;background:#E3E1DA;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;cursor:pointer;font-size:13px}
.seg button.on{background:#fff;font-weight:600}
.aviso{font-size:13px;background:var(--azulclaro);color:#0C447C;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.campeon{background:var(--verde);color:#fff;border-radius:14px;padding:16px;text-align:center;margin-bottom:10px}
.campeon b{display:block;font-size:22px;margin-top:4px}
.campeon small{color:var(--lima2)}
/* publicidad */
.pub{margin-top:14px}
.pub .lbl{font-size:11px;color:var(--gris2);margin:0 2px 3px}
.bronce{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.bronce .ic{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.plata{border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;color:#fff;background:#993C1D;cursor:pointer}
.plata.anim{animation:late 1.2s ease-in-out 3,col 3.6s linear 1}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes col{0%{background:#D85A30}50%{background:#D4537E}100%{background:#993C1D}}
.plata .ic{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:700}
.plata b{display:block}
.plata .wa{margin-left:auto;background:#fff;color:#712B13;border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700}
.oro{position:relative;height:96px;background:#2C2C2A;border-radius:12px;overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.oro .esc2{animation:mv 2.6s ease-in-out infinite alternate;text-align:center}
@keyframes mv{0%{transform:translateX(-36px)}100%{transform:translateX(36px)}}
.oro .mute{position:absolute;left:8px;bottom:6px;font-size:11px;color:#B4B2A9}
.oro .tc{position:absolute;right:8px;bottom:6px;font-size:11px;color:#B4B2A9}
.oro.grande{height:220px}
/* organizador */
.org .p{border-bottom:1px solid var(--linea);padding:8px 0}
.org .p:last-child{border-bottom:0}
.org .eqs{display:grid;grid-template-columns:1fr 48px 12px 48px 1fr;gap:6px;align-items:center;font-size:13px}
.org input[type=number]{width:48px;height:38px;text-align:center;border:1px solid var(--borde);border-radius:8px;background:#fff;font-size:16px;-moz-appearance:textfield}
.org input::-webkit-outer-spin-button,.org input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.org .ctl{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;flex-wrap:wrap}
.org select{border:1px solid var(--borde);border-radius:8px;padding:4px;background:#fff;font-size:12px}
.est{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:600}
.est.falta{background:#F1EFE8;color:var(--gris)}
.est.medias{background:var(--ambar);color:var(--ambar2)}
.est.listo{background:var(--azulclaro);color:#0C447C}
.est.pub{background:var(--verdeclaro);color:var(--verde2)}
.org .err{color:var(--rojo);font-size:12px;margin-top:4px}
.pens{display:flex;gap:6px;align-items:center;font-size:12px;margin-top:6px}
.btn{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px}
.btn.prim{background:var(--verde3);border-color:var(--verde3);color:#fff;font-weight:600}
.btn.w{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
canvas{width:100%;height:auto;border-radius:10px;display:block}
textarea{width:100%;min-height:200px;border:1px solid var(--borde);border-radius:10px;padding:10px;font-size:13px;font-family:inherit;resize:vertical}
.menu .it{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--linea);cursor:pointer}
.menu .it:last-child{border-bottom:0}
.menu .it svg{width:22px;height:22px;color:var(--verde3);flex-shrink:0}
.menu .it small{display:block;color:var(--gris);font-size:12px}
.volver{background:none;border:0;color:var(--verde3);font-weight:600;cursor:pointer;padding:4px 0 10px;font-size:14px}
.cartel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:20}
.cartel[hidden]{display:none}
.cartel div{background:var(--verde);color:#fff;font-size:24px;font-weight:700;padding:22px 30px;border-radius:18px;border:3px solid var(--lima)}
.inf td{padding:6px 4px;border-bottom:1px solid var(--linea);font-size:13px}
.inf td.n2{text-align:right;font-weight:600}
.pie{font-size:11px;color:var(--gris2);text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="t">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#97C459" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h2a2 2 0 0 1 0 4h-2M7 5H5a2 2 0 0 0 0 4h2"/></svg>
      <div><h1 id="tNombre"></h1><div class="s" id="tSub"></div></div>
    </div>
  </header>
  <div class="demo" id="demo">DEMO · equipos, sponsors y resultados inventados</div>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="cartel" id="cartel" hidden><div id="cartelTxt"></div></div>

<script>
/* ===================== DE DÓNDE SALEN LOS DATOS =====================
   PLANILLA: el enlace (o el código) de la planilla de Google del organizador,
   compartida como «Cualquier persona con el enlace · Lector».
   Vacío = DEMO con datos inventados (se carga desde la misma aplicación).
   También se puede probar con  Torneo.html?planilla=ENLACE   o   Torneo.html?prueba=local  */
const PLANILLA = "";
const CADA_SEGUNDOS = 60;   // cada cuánto busca resultados nuevos mientras está abierta

/* ===================== CONFIGURACIÓN (en modo real la pisa la hoja «Configuración») ===================== */
const CONFIG = {
  nombre: "Copa del Barrio 2026",
  puntos: {ganado:3, empatado:1, perdido:0},
  desempate: ["dif","gf","entre"],      // diferencia de gol, goles a favor, partido entre ellos
  clasifican: 8,                        // a la Copa de Oro
  copaPlata: true,                      // puestos 9 a 16
  empateCruce: "penales",               // "penales" o "ventaja" (pasa el mejor ubicado)
  woResultado: [2,0],
  canchas: ["Cancha 1","Cancha 2","Cancha 3"],
  horarios: ["14:00","15:30","17:00"],
  primeraFecha: "2026-10-17",           // sábado
  golesMax: 20
};
let EQUIPOS = [
  ["Los Pibes","#185FA5"],["Deportivo Sur","#A32D2D"],["La Unión","#3B6D11"],["Barrio Norte","#854F0B"],
  ["Estrella Roja","#E24B4A"],["Atlético Oeste","#534AB7"],["Juventud Unida","#0F6E56"],["El Fortín","#2C2C2A"],
  ["San Martín","#378ADD"],["Villa Nueva","#993556"],["Los Halcones","#5F5E5A"],["Defensores","#BA7517"],
  ["Racing del Barrio","#0C447C"],["La Loma","#639922"],["Unidos FC","#D85A30"],["Sportivo Centro","#7F77DD"],
  ["Cruz del Sur","#1D9E75"],["El Progreso","#791F1F"]
].map(([n,c],i)=>nuevoEquipo(n,c,i));
function nuevoEquipo(n,c,i){ return {id:i,n,c:c||"#3B6D11",ini:n.replace(/^(Los|Las|La|El|Club)\s+/i,"").split(/\s+/).filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase()}; }
let SPONSORS = [
  {n:"Carnicería Don José", nivel:"oro",   txt:"Asado para el tercer tiempo", ic:"DJ", c:"#993C1D"},
  {n:"Gimnasio Fuerza",     nivel:"plata", txt:"2x1 en la cuota de noviembre", ic:"GF", c:"#993C1D"},
  {n:"Gomería El Rulo",     nivel:"bronce",txt:"Av. Central 1234", ic:"ER", c:"#5F5E5A"},
  {n:"Kiosco La Esquina",   nivel:"bronce",txt:"Abierto hasta las 2", ic:"KE", c:"#185FA5"},
  {n:"Ferretería Tornillo", nivel:"bronce",txt:"Envíos al barrio", ic:"FT", c:"#3B6D11"}
];

/* ===================== FIXTURE: todos contra todos ===================== */
function fechaDe(n){ const d=new Date(CONFIG.primeraFecha+"T12:00:00"); d.setDate(d.getDate()+7*(n-1)); return d; }
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function fmtFecha(d){ return DIAS[d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"); }
function armarFixture(){
  const n=EQUIPOS.length, t=EQUIPOS.map(e=>e.id), ps=[];
  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){
      let a=t[i], b=t[n-1-i];
      if((i===0 && r%2===1) || (i>0 && (r+i)%2===1)) [a,b]=[b,a];
      ps.push({id:"F"+(r+1)+"-"+(i+1), fecha:r+1, dia:fmtFecha(fechaDe(r+1)), cancha:CONFIG.canchas[i%3], hora:CONFIG.horarios[Math.floor(i/3)], l:a, v:b, gl:"", gv:"", pub:false, wo:""});
    }
    t.splice(1,0,t.pop());
  }
  return ps;
}
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const GOLES=[0,0,1,1,1,2,2,2,3,3,4,5];
function simular(ps, hasta, seed){
  const r=rng(seed);
  ps.forEach(p=>{ if(p.fecha<=hasta && !p.pub){ p.gl=String(GOLES[Math.floor(r()*GOLES.length)]); p.gv=String(GOLES[Math.floor(r()*GOLES.length)]); p.pub=true; } });
}
function estadoInicial(){
  const ps=armarFixture(); simular(ps,5,2026);
  return {partidos:ps, cruces:{}, vistas:{}, toques:{}};
}

/* ===================== ESTADO ===================== */
const QS=new URLSearchParams(location.search);
const ORIGEN = QS.get("prueba")==="local" ? "local" : (QS.get("planilla")||PLANILLA).trim();
const REAL = !!ORIGEN;                       // true = lee la planilla; false = demo
const KEY = REAL ? "torneo_datos_v1_"+(ORIGEN==="local"?"local":idDePlanilla(ORIGEN)) : "torneo_demo_v1";
let S, ACTUALIZADO=null, SIN_CONEXION=false, PLANILLA_ID="";
try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){ S=null; }
if(REAL){ if(!(S&&S.equipos)) S=null; }   // lo guardado se aplica más abajo, cuando todo está definido
else if(!S||!S.partidos) S=estadoInicial();
else S.partidos.forEach(p=>{ if(!p.dia) p.dia=fmtFecha(fechaDe(p.fecha)); });   // demos guardadas antes de este cambio
function guardar(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
let TOTAL_FECHAS=EQUIPOS.length-1;
const eq=id=>EQUIPOS[id];
function diaDe(f){ const p=S.partidos.find(x=>x.fecha===f); return p&&p.dia?p.dia:""; }

/* ===================== LEER LA PLANILLA DE GOOGLE ===================== */
function idDePlanilla(s){ const m=String(s).match(/\/d\/([a-zA-Z0-9_-]{20,})/); return m?m[1]:String(s).replace(/[^a-zA-Z0-9_-]/g,""); }
function leerCSV(t){
  const filas=[]; let f=[], c="", q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){c+='"';i++;} else q=false; } else c+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ f.push(c); c=""; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; f.push(c); filas.push(f); f=[]; c=""; }
    else c+=ch;
  }
  if(c!==""||f.length){ f.push(c); filas.push(f); }
  if(!filas.length) return [];
  const cab=filas[0].map(x=>x.trim());
  return filas.slice(1).filter(r=>r.some(x=>String(x).trim()!=="")).map(r=>{ const o={}; cab.forEach((k,i)=>{ if(k) o[k]=(r[i]??"").trim(); }); return o; });
}
async function hoja(nombre){
  let url;
  if(ORIGEN==="local") url="prueba/"+encodeURIComponent(nombre)+".csv?t="+Date.now();
  else url="https://docs.google.com/spreadsheets/d/"+PLANILLA_ID+"/gviz/tq?tqx=out:csv&headers=1&sheet="+encodeURIComponent(nombre)+"&t="+Date.now();
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("No se pudo leer la hoja «"+nombre+"» ("+r.status+")");
  const t=await r.text();
  if(/^\s*</.test(t)) throw new Error("La planilla no está compartida como «Cualquier persona con el enlace».");
  return leerCSV(t);
}
const esSi=v=>/^s[ií]/i.test(String(v||"").trim());
const num=v=>{ const s=String(v??"").trim().replace(/\.0+$/,""); return /^\d{1,2}$/.test(s)?String(+s):""; };
async function traerPlanilla(){
  PLANILLA_ID=ORIGEN==="local"?"":idDePlanilla(ORIGEN);
  const [P,C,E,PU,CF]=await Promise.all(["Partidos","Cruces","Equipos","Publicidad","Configuración"].map(n=>hoja(n).catch(e=>{ if(n==="Partidos"||n==="Equipos") throw e; return []; })));
  const d={equipos:[],partidos:[],cruces:{},sponsors:[],config:{},cuando:Date.now()};
  const idx={};
  const idEq=(n,c)=>{ n=String(n||"").trim(); if(!n) return null; const k=n.toLowerCase(); if(!(k in idx)){ idx[k]=d.equipos.length; d.equipos.push([n,c||""]); } return idx[k]; };
  E.forEach(r=>idEq(r["Equipo"],r["Color"]));
  P.forEach((r,i)=>{
    const l=idEq(r["Local"]), v=idEq(r["Visitante"]), fe=parseInt(r["Fecha"],10);
    if(l===null||v===null||!fe) return;
    const wo=/^loc/i.test(r["No se presentó"])?"l":/^vis/i.test(r["No se presentó"])?"v":"";
    let gl=num(r["Goles local"]), gv=num(r["Goles visitante"]);
    if(wo){ const [a,b]=CONFIG.woResultado; if(wo==="l"){gl=String(b);gv=String(a);} else {gl=String(a);gv=String(b);} }
    d.partidos.push({id:"P"+(i+2),fecha:fe,dia:r["Día"]||"",hora:String(r["Hora"]||"").slice(0,5),cancha:r["Cancha"]||"",l,v,gl,gv,wo,pub:esSi(r["Publicar"])&&gl!==""&&gv!==""});
  });
  if(!d.partidos.length) throw new Error("No encontré los partidos: revisá que la hoja se llame «Partidos» y tenga las columnas Fecha, Local y Visitante.");
  C.forEach(r=>{
    const copa=/^pla/i.test(r["Copa"])?"plata":"oro", k=String(r["Llave"]||"").trim(); if(!k) return;
    (d.cruces[copa]||(d.cruces[copa]={}))[k]={gl:num(r["Goles 1°"]),gv:num(r["Goles 2°"]),pl:num(r["Penales 1°"]),pv:num(r["Penales 2°"]),pub:esSi(r["Publicar"])};
  });
  const hoy=new Date(); hoy.setHours(12,0,0,0);
  const fechaDMA=s=>{ const m=String(s||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(!m) return null; return new Date(+(m[3].length===2?"20"+m[3]:m[3]),m[2]-1,+m[1],12); };
  PU.forEach(r=>{
    if(!esSi(r["Activo"])||!r["Comercio"]) return;
    const de=fechaDMA(r["Desde"]), ha=fechaDMA(r["Hasta"]);
    if(de&&hoy<de) return; if(ha&&hoy>ha) return;

  });
  CF.forEach(r=>{ if(r["Dato"]) d.config[r["Dato"].trim().toLowerCase()]=String(r["Valor"]??"").trim(); });
  return d;
}
function aplicarDatos(d){

  if(n("clasifican a la copa de oro")) CONFIG.clasifican=n("clasifican a la copa de oro");
  if(c["copa de plata"]) CONFIG.copaPlata=esSi(c["copa de plata"]);
  if(c["empate en los cruces"]) CONFIG.empateCruce=/vent/i.test(c["empate en los cruces"])?"ventaja":"penales";
  if(c["goles máximos"]&&n("goles máximos")) CONFIG.golesMax=n("goles máximos");
  if(c["resultado del w.o."]){ const m=c["resultado del w.o."].match(/(\d+)\D+(\d+)/); if(m) CONFIG.woResultado=[+m[1],+m[2]]; }
  if(c["desempate"]){ const t=c["desempate"].toLowerCase(), orden=[["dif",t.indexOf("diferencia")],["gf",t.indexOf("favor")],["entre",t.indexOf("entre")]].filter(x=>x[1]>=0).sort((a,b)=>a[1]-b[1]).map(x=>x[0]); if(orden.length) CONFIG.desempate=orden; }
  EQUIPOS=d.equipos.map(([nm,col],i)=>nuevoEquipo(nm,col||PALETA[i%PALETA.length],i));
  SPONSORS=d.sponsors.map(s=>({...s,ic:s.n.split(/\s+/).filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase(),c:s.nivel==="oro"?"#993C1D":s.nivel==="plata"?"#993C1D":"#5F5E5A"}));
  TOTAL_FECHAS=Math.max(1,...d.partidos.map(p=>p.fecha));
  if(CONFIG.copaPlata&&EQUIPOS.length<CONFIG.clasifican+8) CONFIG.copaPlata=false;
}

function tabla(){
  const T=EQUIPOS.map(e=>({id:e.id,pts:0,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0}));
  const pub=S.partidos.filter(p=>p.pub);
  pub.forEach(p=>{
    const a=T[p.l], b=T[p.v], x=+p.gl, y=+p.gv;
    a.pj++; b.pj++; a.gf+=x; a.gc+=y; b.gf+=y; b.gc+=x;
    if(x>y){a.pg++; b.pp++; a.pts+=CONFIG.puntos.ganado; b.pts+=CONFIG.puntos.perdido;}
    else if(x<y){b.pg++; a.pp++; b.pts+=CONFIG.puntos.ganado; a.pts+=CONFIG.puntos.perdido;}
    else {a.pe++; b.pe++; a.pts+=CONFIG.puntos.empatado; b.pts+=CONFIG.puntos.empatado;}
  });
  const entre=(a,b)=>{ let pa=0,pb=0; pub.forEach(p=>{ if(p.l===a.id&&p.v===b.id){ if(+p.gl>+p.gv)pa+=3; else if(+p.gl<+p.gv)pb+=3; else {pa++;pb++;} } if(p.l===b.id&&p.v===a.id){ if(+p.gl>+p.gv)pb+=3; else if(+p.gl<+p.gv)pa+=3; else {pa++;pb++;} } }); return pb-pa; };
  T.sort((a,b)=>{
    if(b.pts!==a.pts) return b.pts-a.pts;
    for(const c of CONFIG.desempate){
      let d=0;
      if(c==="dif") d=(b.gf-b.gc)-(a.gf-a.gc);
      if(c==="gf") d=b.gf-a.gf;
      if(c==="entre") d=entre(a,b);
      if(d) return d;
    }
    return eq(a.id).n.localeCompare(eq(b.id).n);
  });
  return T;
}
function faseRegularTerminada(){ return S.partidos.every(p=>p.pub); }
function ultimaFechaJugada(){ let f=0; S.partidos.forEach(p=>{ if(p.pub) f=Math.max(f,p.fecha); }); return f; }
function fechaActual(){ for(let f=1;f<=TOTAL_FECHAS;f++){ if(S.partidos.some(p=>p.fecha===f&&!p.pub)) return f; } return TOTAL_FECHAS; }

/* Cruces: 1-8, 4-5, 2-7, 3-6 → semis → final */
const PARES=[[0,7],[3,4],[1,6],[2,5]];
function llave(copa){
  const T=tabla(), off=copa==="oro"?0:CONFIG.clasifican;
  const seeds=T.slice(off,off+8).map((t,i)=>({id:t.id,pos:off+i+1}));
  const C=S.cruces[copa]||(S.cruces[copa]={});
  const res=(k,A,B)=>{
    const m=C[k]||{}; const o={k,A,B,gl:m.gl??"",gv:m.gv??"",pl:m.pl??"",pv:m.pv??"",pub:!!m.pub,gan:null};
    if(o.pub&&A&&B){ const x=+o.gl,y=+o.gv;
      if(x>y)o.gan=A; else if(y>x)o.gan=B;
      else if(CONFIG.empateCruce==="penales") o.gan=(o.pl!==""&&o.pv!==""&&o.pl!==o.pv)?((+o.pl>+o.pv)?A:B):null;
      else o.gan=(A.pos<B.pos)?A:B; }
    return o;
  };
  const qf=PARES.map((pr,i)=>res("qf"+i,seeds[pr[0]],seeds[pr[1]]));
  const sf=[res("sf0",qf[0].gan,qf[1].gan),res("sf1",qf[2].gan,qf[3].gan)];
  const fi=res("f0",sf[0].gan,sf[1].gan);
  return {qf,sf,fi,campeon:fi.gan};
}

    html+=`<div class="selfecha"><button data-fcar="-1" aria-label="Fecha anterior">‹</button><div style="text-align:center"><b>Fecha ${f}</b><small>${diaDe(f)}</small></div><button data-fcar="1" aria-label="Fecha siguiente">›</button></div><div class="card org">`;
    ps.forEach(p=>{
      const [ce,te]=estadoP(p), L=eq(p.l), V=eq(p.v);
      html+=`<div class="p" data-pid="${p.id}"><div class="eqs"><span style="text-align:right">${h(L.n)}</span><input type="number" inputmode="numeric" min="0" max="${CONFIG.golesMax}" value="${h(p.gl)}" data-k="gl" aria-label="Goles de ${h(L.n)}"><span style="text-align:center">–</span><input type="number" inputmode="numeric" min="0" max="${CONFIG.golesMax}" value="${h(p.gv)}" data-k="gv" aria-label="Goles de ${h(V.n)}"><span>${h(V.n)}</span></div>
      <div class="ctl"><span class="est ${ce}">${te}</span><label><input type="checkbox" data-k="pub" ${p.pub?"checked":""}> Publicar</label>
      <select data-k="wo" aria-label="No presentación"><option value="">Se jugó</option><option value="l" ${p.wo==="l"?"selected":""}>W.O.: no vino ${h(L.n)}</option><option value="v" ${p.wo==="v"?"selected":""}>W.O.: no vino ${h(V.n)}</option></select>
      <span style="color:var(--gris2)">${p.cancha} · ${p.hora}</span></div><div class="err"></div></div>`;
    });
    html+=`</div><button class="btn w" data-accion="simular">Simular el resto de la fase regular (para ver los cruces)</button>`;
  } else {
    const copa=fasesCarga, k=llave(copa);
    if(!faseRegularTerminada()){ html+=`<div class="aviso">Los cruces se cargan cuando termina la fase regular. Para verlo ahora, tocá «Simular el resto de la fase regular» en la pestaña Fechas.</div>`; }
    else{
      html+=`<div class="card org">`;
      const filas=[...k.qf.map((o,i)=>["Cuartos "+(i+1),o]),...k.sf.map((o,i)=>["Semifinal "+(i+1),o]),["Final",k.fi]];
      filas.forEach(([tit,o])=>{
        if(!o.A||!o.B){ html+=`<div class="p"><div class="k">${tit}</div><div style="color:var(--gris2);font-size:13px">Espera a los ganadores anteriores</div></div>`; return; }
        html+=`<div class="p" data-cruce="${copa}|${o.k}"><div class="k">${tit}</div><div class="eqs"><span style="text-align:right">${o.A.pos}° ${h(eq(o.A.id).n)}</span><input type="number" inputmode="numeric" min="0" max="${CONFIG.golesMax}" value="${h(o.gl)}" data-k="gl"><span style="text-align:center">–</span><input type="number" inputmode="numeric" min="0" max="${CONFIG.golesMax}" value="${h(o.gv)}" data-k="gv"><span>${o.B.pos}° ${h(eq(o.B.id).n)}</span></div>
        ${CONFIG.empateCruce==="penales"?`<div class="pens">Penales, sólo si empatan:<input type="number" min="0" max="30" value="${h(o.pl)}" data-k="pl" style="width:44px;height:32px"> – <input type="number" min="0" max="30" value="${h(o.pv)}" data-k="pv" style="width:44px;height:32px"></div>`:""}
        <div class="ctl"><label><input type="checkbox" data-k="pub" ${o.pub?"checked":""}> Publicar</label>${o.gan?`<span class="est pub">Pasa ${h(eq(o.gan.id).n)}</span>`:""}</div><div class="err"></div></div>`;
      });
      html+=`</div>`;
    }
  }
  return html;
}

/* ---------- Instagram ---------- */
function vInsta(){
  const fs=[]; for(let f=1;f<=TOTAL_FECHAS;f++) if(S.partidos.some(p=>p.fecha===f&&p.pub)) fs.push(f);
  if(fechaVista===null||!fs.includes(fechaVista)) fechaVista=fs[fs.length-1]||1;
  return `<button class="volver" data-go="mas">‹ Volver</button><h2>Imagen para Instagram</h2>
  <div class="selfecha"><button data-fi="-1">‹</button><b>Fecha ${fechaVista}</b><button data-fi="1">›</button></div>
  <canvas id="cv" width="1080" height="1350"></canvas>
  <div class="btns" style="margin-top:10px"><button class="btn prim" data-accion="bajar">Descargar imagen</button></div>
  <div class="k" style="margin-top:8px">Se descarga y se sube a Instagram o Facebook. Los sponsors van abajo; el Oro, arriba.</div>`;
}
function dibujarPlaca(){
  const cv=document.getElementById("cv"); if(!cv) return; const g=cv.getContext("2d"), W=1080, H=1350, f=fechaVista;
  const ps=S.partidos.filter(p=>p.fecha===f&&p.pub), oro=SPONSORS.find(s=>s.nivel==="oro");
  g.fillStyle="#173404"; g.fillRect(0,0,W,H);
  g.fillStyle="#27500A"; g.fillRect(0,0,W,250);
  g.fillStyle="#C0DD97"; g.font="500 40px system-ui,Segoe UI,Arial"; g.fillText(CONFIG.nombre.toUpperCase(),70,95);
  g.fillStyle="#fff"; g.font="700 84px system-ui,Segoe UI,Arial"; g.fillText("RESULTADOS · FECHA "+f,70,190);
  if(oro){ g.fillStyle="#FAC775"; g.font="500 34px system-ui,Segoe UI,Arial"; g.fillText("La Fecha "+f+" la trae "+oro.n,70,310); }
  const ajustar=(txt,peso,tam,ancho)=>{ let t=tam; do{ g.font=`${peso} ${t}px system-ui,Segoe UI,Arial`; t-=2; }while(g.measureText(txt).width>ancho&&t>18); };
  let y=400;
  ps.forEach(p=>{
    const L=eq(p.l), V=eq(p.v);
    g.fillStyle="rgba(255,255,255,0.06)"; g.fillRect(60,y-58,W-120,78);
    g.fillStyle="#fff"; g.textAlign="right"; ajustar(L.n,500,40,360); g.fillText(L.n,445,y);
    g.textAlign="left"; ajustar(V.n,500,40,360); g.fillText(V.n,635,y);
    g.fillStyle="#97C459"; g.fillRect(465,y-52,150,66);
    g.fillStyle="#173404"; g.font="700 46px system-ui,Segoe UI,Arial"; g.textAlign="center"; g.fillText(p.gl+" - "+p.gv,540,y); g.textAlign="left";
    y+=86;
  });
  if(!ps.length){ g.fillStyle="#C0DD97"; g.font="500 40px system-ui"; g.fillText("Todavía no hay resultados publicados.",70,y); }
  const pie=SPONSORS.filter(s=>s.nivel!=="oro");
  g.fillStyle="#fff"; g.fillRect(0,H-150,W,150);
  g.fillStyle="#5F5E5A"; g.font="500 26px system-ui,Segoe UI,Arial"; g.fillText("ACOMPAÑAN",70,H-100);
  const lp=pie.map(s=>s.n).join("   ·   "); g.fillStyle="#2C2C2A"; ajustar(lp,600,30,W-140); g.fillText(lp,70,H-50);
}

/* ---------- WhatsApp ---------- */
function textoWA(f){
  const ps=S.partidos.filter(p=>p.fecha===f&&p.pub), T=tabla(), oro=SPONSORS.find(s=>s.nivel==="oro");
  let t=`*${CONFIG.nombre.toUpperCase()}*\nResultados · Fecha ${f}\n`;
  if(oro) t+=`La Fecha ${f} la trae ${oro.n}\n`;
  t+=`\n`;
  ps.forEach(p=>{ t+=`${eq(p.l).n} ${p.gl} – ${p.gv} ${eq(p.v).n}${p.wo?" (W.O.)":""}\n`; });
  const falt=S.partidos.filter(p=>p.fecha===f&&!p.pub).length;
  if(falt) t+=`\nFaltan ${falt} partidos de esta fecha.\n`;
  const camp=llave("oro").campeon;
  t+=camp?`\nCampeón: ${eq(camp.id).n}\n`:`\nPuntero: ${eq(T[0].id).n} (${T[0].pts} pts)\n`;
  t+=`Tabla y cruces en la app.\n\nAcompañan: ${SPONSORS.map(s=>s.n).join(" · ")}`;
  return t;
}
function vWA(){
  if(fechaVista===null) fechaVista=Math.max(1,ultimaFechaJugada());
  return `<button class="volver" data-go="mas">‹ Volver</button><h2>Texto para WhatsApp y Facebook</h2>
  <div class="selfecha"><button data-fw="-1">‹</button><b>Fecha ${fechaVista}</b><button data-fw="1">›</button></div>
  <textarea id="txwa" readonly>${h(textoWA(fechaVista))}</textarea>
  <div class="btns" style="margin-top:10px"><button class="btn prim" data-accion="copiar">Copiar texto</button><button class="btn" data-accion="abrirwa">Abrir WhatsApp</button></div>`;
}

  return html+`</table></div>`;
}
function vReglas(){
  const P=CONFIG.puntos;

  <b>Copa de Oro:</b> los ${CONFIG.clasifican} primeros. Cuartos 1°-8°, 2°-7°, 3°-6°, 4°-5°; semifinales y final.<br>
  ${CONFIG.copaPlata?`<b>Copa de Plata:</b> del ${CONFIG.clasifican+1}° al ${CONFIG.clasifican+8}°, con el mismo sistema.<br>`:""}
  <b>Empate en un cruce:</b> ${CONFIG.empateCruce==="penales"?"penales":"pasa el mejor ubicado"}.<br>
  <b>No presentación (W.O.):</b> el rival gana ${CONFIG.woResultado[0]} a ${CONFIG.woResultado[1]}.</div>
  <div class="k">En la versión final esto sale del reglamento del torneo.</div>`;

/* ===================== NAVEGACIÓN ===================== */
const TABS=[["inicio","Inicio"],["fecha","Fecha"],["tabla","Tabla"],["cruces","Cruces"],["mas","Más"]];
const VISTAS={inicio:vInicio,fecha:vFecha,tabla:vTabla,cruces:vCruces,mas:vMas,fixture:vFixture,cargar:vCargar,insta:vInsta,wa:vWA,informe:vInforme,reglas:vReglas};
function tabDe(p){ return ({fixture:"mas",cargar:"mas",insta:"mas",wa:"mas",informe:"mas",reglas:"mas"})[p]||p; }
const hora=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
function pintarCabecera(){
  document.getElementById("tNombre").textContent=CONFIG.nombre;
  const sub=document.getElementById("tSub"), dm=document.getElementById("demo");
  if(!S){ sub.textContent="Buscando resultados…"; }
  else{ const fa=fechaActual(); sub.textContent=faseRegularTerminada()?"Fase final · cruces":`Fecha ${fa} · ${diaDe(fa)}`; }
  if(!REAL){ dm.hidden=false; dm.textContent="DEMO · equipos, sponsors y resultados inventados"; }
  else if(SIN_CONEXION&&S){ dm.hidden=false; dm.textContent="Sin conexión · se muestra lo de las "+(ACTUALIZADO?hora(ACTUALIZADO):"—"); }
  else if(ORIGEN==="local"){ dm.hidden=false; dm.textContent="PRUEBA con la planilla local"+(ACTUALIZADO?" · leída "+hora(ACTUALIZADO):""); }
  else dm.hidden=true;
}
function render(){
  pintarCabecera();
  if(!S){ main.innerHTML=`<div class="card" style="text-align:center;padding:24px">Buscando los resultados…</div>`; document.getElementById("nav").innerHTML=""; return; }
  main.innerHTML=VISTAS[pantalla]();
  document.getElementById("nav").innerHTML=TABS.map(([k,t])=>`<button data-go="${k}" class="${tabDe(pantalla)===k?"on":""}">${svg(k)}${t}</button>`).join("");
  if(pantalla==="insta") dibujarPlaca();
}
function ir(p){ if(["fecha","insta","wa"].includes(p)) fechaVista=null; pantalla=p; render(); window.scrollTo(0,0); }
let cartelT;
function cartel(t){ const c=document.getElementById("cartel"); document.getElementById("cartelTxt").textContent=t; c.hidden=false; clearTimeout(cartelT); cartelT=setTimeout(()=>c.hidden=true,1600); }

document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]"); if(go){ ir(go.dataset.go); return; }
  const sp=e.target.closest("[data-sp]"); if(sp){ tocarSponsor(sp.dataset.sp); return; }
  const oro=e.target.closest("[data-sp-oro]"); if(oro){
    if(!oro.classList.contains("grande")){ oro.classList.add("grande"); oro.querySelector(".mute").textContent="con sonido"; oro.querySelector(".tc").textContent="Tocá para escribirle"; S.toques[oro.dataset.spOro]=(S.toques[oro.dataset.spOro]||0)+1; guardar(); }
    else tocarSponsor(oro.dataset.spOro);
    return; }
  const bf=e.target.closest("[data-f]"); if(bf){ fechaVista=Math.min(TOTAL_FECHAS,Math.max(1,fechaVista+ +bf.dataset.f)); render(); return; }
  const bi=e.target.closest("[data-fi]"); if(bi){ fechaVista=Math.min(TOTAL_FECHAS,Math.max(1,fechaVista+ +bi.dataset.fi)); render(); return; }
  const bw=e.target.closest("[data-fw]"); if(bw){ fechaVista=Math.min(TOTAL_FECHAS,Math.max(1,fechaVista+ +bw.dataset.fw)); render(); return; }
  const bc=e.target.closest("[data-fcar]"); if(bc){ fechaCarga=Math.min(TOTAL_FECHAS,Math.max(1,fechaCarga+ +bc.dataset.fcar)); render(); return; }
  const cp=e.target.closest("[data-copa]"); if(cp){ copaVista=cp.dataset.copa; render(); return; }
  const fc=e.target.closest("[data-fc]"); if(fc){ fasesCarga=fc.dataset.fc; render(); return; }
  const ac=e.target.closest("[data-accion]"); if(!ac) return;
  const a=ac.dataset.accion;
  if(a==="actualizar"){ cartel("BUSCANDO…"); actualizar().then(()=>{ if(!SIN_CONEXION) cartel("AL DÍA"); if(pantalla==="mas") render(); }); }
  if(a==="reset"){ if(confirm("¿Volver la demo al principio? Se borra lo cargado en este celular.")){ S=estadoInicial(); guardar(); fechaCarga=null; cartel("DEMO REINICIADA"); ir("inicio"); } }
  if(a==="simular"){ simular(S.partidos,TOTAL_FECHAS,Date.now()%100000); guardar(); cartel("FASE REGULAR COMPLETA"); fasesCarga="oro"; render(); }
  if(a==="bajar"){ const cv=document.getElementById("cv"); const l=document.createElement("a"); l.download="resultados-fecha-"+fechaVista+".png"; l.href=cv.toDataURL("image/png"); l.click(); cartel("IMAGEN DESCARGADA"); }
  if(a==="copiar"){ const t=document.getElementById("txwa").value; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>cartel("YA SE COPIÓ"),()=>{ const ta=document.getElementById("txwa"); ta.removeAttribute("readonly"); ta.select(); document.execCommand("copy"); ta.setAttribute("readonly",""); cartel("YA SE COPIÓ"); }); }
  if(a==="abrirwa"){ window.open("https://wa.me/?text="+encodeURIComponent(document.getElementById("txwa").value),"_blank"); }
});

function actualizarFila(box,p){
  const [ce,te]=estadoP(p), b=box.querySelector(".est"); b.className="est "+ce; b.textContent=te;
  box.querySelector('[data-k="pub"]').checked=p.pub; box.querySelector('[data-k="wo"]').value=p.wo;
}
function validoGol(v,max){ return v===""||(/^\d{1,2}$/.test(v)&&+v<=max); }
document.addEventListener("change",e=>{
  const box=e.target.closest("[data-pid],[data-cruce]"); if(!box) return;
  const err=box.querySelector(".err"), k=e.target.dataset.k;
  if(box.dataset.pid){
    const p=S.partidos.find(x=>x.id===box.dataset.pid);
    if(k==="gl"||k==="gv"){
      const v=e.target.value.trim();
      if(!validoGol(v,CONFIG.golesMax)){ err.textContent="Sólo números de 0 a "+CONFIG.golesMax+"."; e.target.value=p[k]; return; }
      p[k]=v; if(p.pub&&(p.gl===""||p.gv==="")) p.pub=false; p.wo="";
      err.textContent=""; actualizarFila(box,p); guardar(); return;   // sin redibujar: no se pierde el toque
    }
    if(k==="wo"){ p.wo=e.target.value; if(p.wo){ const [a,b]=CONFIG.woResultado; if(p.wo==="l"){p.gl=String(b);p.gv=String(a);} else {p.gl=String(a);p.gv=String(b);} } }
    if(k==="pub"){
      if(e.target.checked&&(p.gl===""||p.gv==="")){ e.target.checked=false; err.textContent="No se puede publicar: faltan los goles."; return; }
      p.pub=e.target.checked; if(p.pub) cartel("PUBLICADO");
    }
  } else {
    const [copa,key]=box.dataset.cruce.split("|"); const C=S.cruces[copa]||(S.cruces[copa]={}); const m=C[key]||(C[key]={gl:"",gv:"",pl:"",pv:"",pub:false});
    if(["gl","gv","pl","pv"].includes(k)){
      const v=e.target.value.trim(), max=k[0]==="p"?30:CONFIG.golesMax;
      if(!validoGol(v,max)){ err.textContent="Sólo números."; e.target.value=m[k]; return; }
      m[k]=v; if(m.pub) m.pub=false;
      // si cambia un cruce, se despublican los que dependen de él
      const dep={qf0:["sf0","f0"],qf1:["sf0","f0"],qf2:["sf1","f0"],qf3:["sf1","f0"],sf0:["f0"],sf1:["f0"]}[key]||[];
      const habia=dep.some(d=>C[d]&&C[d].pub);
      dep.forEach(d=>{ if(C[d]) C[d].pub=false; });
      err.textContent=""; const cb=box.querySelector('[data-k="pub"]'); if(cb) cb.checked=false;
      guardar(); if(habia) render(); return;
    }
    if(k==="pub"){
      if(e.target.checked){
        if(m.gl===""||m.gv===""){ e.target.checked=false; err.textContent="Faltan los goles."; return; }
        if(m.gl===m.gv&&CONFIG.empateCruce==="penales"&&(m.pl===""||m.pv===""||m.pl===m.pv)){ e.target.checked=false; err.textContent="Empate: cargá los penales (no pueden quedar iguales)."; return; }
        cartel("PUBLICADO");
      }
      m.pub=e.target.checked;
    }
  }
  guardar(); render();
});

setInterval(()=>{ if(S&&["fecha","cruces","fixture"].includes(pantalla)){ broncePos++; const b=document.querySelector(".bronce:not([style])"); const bs=SPONSORS.filter(s=>s.nivel==="bronce"); if(b&&bs.length){ const s=bs[broncePos%bs.length]; contarVista(s.n); b.dataset.sp=s.n; b.innerHTML=`<div class="ic" style="background:${s.c}">${s.ic}</div><div><b>${h(s.n)}</b> · <span style="color:var(--gris)">${h(s.txt)}</span></div>`; } } },7000);
if(REAL&&S){ aplicarDatos(S); ACTUALIZADO=S.cuando?new Date(S.cuando):null; }
render();
if(REAL){
  actualizar();
  setInterval(()=>{ if(document.visibilityState==="visible") actualizar(); }, CADA_SEGUNDOS*1000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") actualizar(); });
  window.addEventListener("online",actualizar);
}
/* que la página abra aunque no haya señal (sólo cuando está publicada en internet) */
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
